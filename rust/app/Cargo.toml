[package]
name = "peerbanhelper"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
linux-webview = ["pbh-desktop/linux-webview"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dns-lookup = "4"
flate2 = "1"
form_urlencoded = "1"
futures-util = "0.3"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
ipnet.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
mime = "0.3"
pbh-aria2next = { path = "../aria2next" }
pbh-biglybt = { path = "../biglybt" }
pbh-bitcomet = { path = "../bitcomet" }
pbh-btn = { path = "../btn" }
pbh-core = { path = "../core" }
pbh-deluge = { path = "../deluge" }
pbh-desktop = { path = "../desktop" }
pbh-geoip = { path = "../geoip" }
pbh-network = { path = "../network" }
pbh-plus = { path = "../plus" }
pbh-qbittorrent = { path = "../qbittorrent" }
pbh-storage = { path = "../storage" }
pbh-transmission = { path = "../transmission" }
pbh-traversal = { path = "../traversal" }
pbh-web = { path = "../web" }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
sys-locale = "0.3"
tempfile = "3"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
