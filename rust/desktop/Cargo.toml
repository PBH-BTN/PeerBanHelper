[package]
name = "pbh-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
linux-webview = ["dep:gtk", "dep:webkit2gtk"]

[dependencies]
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
ksni = "0.3.7"
png = "0.18"
tokio = { version = "1", features = ["process", "rt", "time"] }
webkit2gtk = { version = "2.0", optional = true, features = ["v2_6"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "std",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSData",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "std",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "WKNavigation",
    "WKNavigationAction",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWindowFeatures",
    "objc2-app-kit",
    "objc2-core-foundation",
    "std",
] }

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
